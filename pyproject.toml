[project]
name = "daiist-group-project"
version = "0.1.0"
description = "DAIIST group assignment: an AI product with two connected components, deployed, logged and monitored"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gradio>=5.0",
    "huggingface-hub>=0.30",
    "langchain==1.5.0",
    "langchain-google-genai==4.4.3",
    "numpy>=2.0",
    "pandas>=2.2",
    "pypdf>=6,<8",
    # the exam reader (vision/reader.py): TrOCR, the YOLO detectors, PDF pages
    "torch==2.14.1",
    "torchvision==0.29.1",
    "transformers>=4.46",
    "peft>=0.17",   # loads the fine-tuned page reader at inference
    "ultralytics>=8.4,<8.5",
    "opencv-python-headless>=4.10",
    "pypdfium2>=4.30",
    "pillow>=10.0",
]

# Only for running evaluate.ipynb locally; not installed on the Space.
[dependency-groups]
dev = [
    "nbconvert>=7.16",
    "ipykernel>=6.29",
]
# Only for training the vision detectors (vision/train_detector.py); not installed on the Space.
# (torch, ultralytics and opencv are already in the main dependencies, for the reader.)
train = [
    "roboflow>=1.7",
    "matplotlib>=3.9",
    "pyarrow>=17",  # reads the fine-tuning data (vision/finetune_data.py)
]

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

# Windows x64 uses the same CUDA-enabled wheels as the validated page reader.
# PyTorch selects CPU when a compatible NVIDIA driver is unavailable.
[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32' and platform_machine == 'AMD64'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32' and platform_machine == 'AMD64'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
